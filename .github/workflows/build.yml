name: build
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix flake check --no-build
      - run: nix build .#darwinConfigurations.mac.system
      - run: nix shell nixpkgs#bats nixpkgs#jq nixpkgs#shellcheck -c sh -c 'shellcheck bin/doctor bin/audit bin/audit-page bootstrap.sh rebuild.sh && bats tests'
